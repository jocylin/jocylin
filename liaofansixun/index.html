<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>了凡四训</title>
  <meta name="description" content="《了凡四训》手机适配阅读页。">
  <meta property="og:title" content="了凡四训">
  <meta property="og:description" content="《了凡四训》手机适配阅读页。">
  <meta property="og:type" content="website">
  <meta property="og:image" content="./cover.png">
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f2e8;
      --ink: #211c16;
      --muted: #6e6254;
      --line: rgba(77, 62, 42, .18);
      --accent: #8c4b2f;
      --accent-2: #234a41;
      --shadow: 0 18px 58px rgba(42, 31, 18, .14);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      overflow-x: hidden;
      font-family: ui-serif, "Songti SC", "Noto Serif CJK SC", "STSong", Georgia, serif;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(35, 74, 65, .07) 0 1px, transparent 1px 100%),
        linear-gradient(180deg, rgba(140, 75, 47, .06), transparent 36rem),
        var(--paper);
      background-size: 28px 28px, auto, auto;
    }

    a { color: inherit; }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: max(20px, env(safe-area-inset-top)) 0 max(28px, env(safe-area-inset-bottom));
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(230px, 360px);
      gap: clamp(22px, 4vw, 56px);
      align-items: end;
      min-height: min(50vh, 520px);
      padding: clamp(18px, 4vw, 44px) 0 28px;
      border-bottom: 1px solid var(--line);
    }

    .kicker {
      margin: 0 0 14px;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      letter-spacing: 0;
      color: var(--accent-2);
    }

    h1 {
      margin: 0;
      font-size: clamp(46px, 10vw, 118px);
      line-height: .98;
      font-weight: 600;
      letter-spacing: 0;
    }

    .intro {
      max-width: 700px;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 23px);
      line-height: 1.78;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 6px;
      text-decoration: none;
      background: rgba(255, 255, 255, .58);
      font-size: 15px;
      white-space: nowrap;
    }

    .button.primary {
      color: #fffaf2;
      background: var(--accent);
      border-color: transparent;
    }

    .cover {
      width: min(100%, 360px);
      justify-self: end;
      border-radius: 4px;
      box-shadow: var(--shadow);
      background: #fffaf2;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    .reader {
      padding: clamp(20px, 4vw, 44px) 0 0;
    }

    .reader-bar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--muted);
      font-size: 14px;
    }

    .pages {
      display: grid;
      gap: clamp(14px, 2.8vw, 28px);
    }

    .page {
      width: 100%;
      height: auto;
      display: block;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fffaf2;
      box-shadow: var(--shadow);
    }

    @media (max-width: 760px) {
      .shell {
        width: 100%;
        padding: max(12px, env(safe-area-inset-top)) 0 max(18px, env(safe-area-inset-bottom));
      }

      .hero {
        grid-template-columns: 1fr;
        min-height: auto;
        padding: 18px 12px 22px;
      }

      .cover {
        width: 100%;
        justify-self: start;
        order: -1;
      }

      .intro {
        font-size: 17px;
      }

      .actions {
        gap: 10px;
      }

      .button {
        flex: 1 1 142px;
      }

      .reader {
        padding-top: 14px;
      }

      .reader-bar {
        padding: 0 12px;
        align-items: flex-start;
        flex-direction: column;
      }

      .pages {
        gap: 10px;
      }

      .page {
        width: 100vw;
        border-left: 0;
        border-right: 0;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero" aria-label="书籍介绍">
      <div>
        <p class="kicker">Ming Dynasty moral classic · 袁了凡家训</p>
        <h1>了凡四训</h1>
        <p class="intro">立命之学、改过之法、积善之方、谦德之效。页面已改为手机屏幕适配的逐页阅读版，打开后按屏幕宽度自动缩放，竖向滑动阅读。</p>
        <div class="actions">
          <a class="button primary" href="#reader">开始阅读</a>
          <a class="button" href="./liaofan-sixun.pdf" target="_blank" rel="noopener">打开 PDF</a>
          <a class="button" href="./liaofan-sixun.pdf" download>下载原文</a>
        </div>
      </div>
      <img class="cover" src="./cover.png" alt="《了凡四训》封面预览">
    </section>

    <section class="reader" id="reader" aria-label="逐页阅读">
      <div class="reader-bar">
        <strong>手机适配阅读版</strong>
        <span>共 5 页，按屏幕宽度自动适配。</span>
      </div>
      <div class="pages">
        <img class="page" src="./pages/page-01.jpg" width="1600" height="900" alt="《了凡四训》第 1 页" loading="eager">
        <img class="page" src="./pages/page-02.jpg" width="1600" height="900" alt="《了凡四训》第 2 页" loading="lazy">
        <img class="page" src="./pages/page-03.jpg" width="1600" height="900" alt="《了凡四训》第 3 页" loading="lazy">
        <img class="page" src="./pages/page-04.jpg" width="1600" height="900" alt="《了凡四训》第 4 页" loading="lazy">
        <img class="page" src="./pages/page-05.jpg" width="1600" height="900" alt="《了凡四训》第 5 页" loading="lazy">
      </div>
    </section>
  </main>
</body>
</html>
