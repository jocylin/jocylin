<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asia Payment Network 白皮書</title>
<style>
  :root{
    --ink:#16202e;
    --ink-soft:#445267;
    --paper:#f3efe6;
    --paper-deep:#e9e3d5;
    --brass:#a17c3c;
    --line:#cfc7b4;
    --white:#fbfaf6;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    overflow-x:hidden;
    background:var(--paper);
    color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  .topbar{
    position:sticky;
    top:0;
    z-index:10;
    border-bottom:1px solid var(--line);
    background:rgba(243,239,230,.94);
    backdrop-filter:blur(14px);
  }
  .topbar-inner{
    max-width:1120px;
    margin:0 auto;
    min-height:64px;
    padding:12px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
    font-weight:650;
    letter-spacing:0;
  }
  .brand-dot{
    width:9px;
    height:9px;
    flex:0 0 auto;
    border-radius:50%;
    background:var(--brass);
  }
  .brand span{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .actions{
    display:flex;
    align-items:center;
    gap:10px;
    flex:0 0 auto;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:38px;
    padding:0 14px;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--white);
    color:var(--ink);
    text-decoration:none;
    font-size:14px;
    font-weight:600;
  }
  .btn.primary{
    border-color:var(--brass);
    background:var(--brass);
    color:#1d1608;
  }
  .hero{
    max-width:1120px;
    margin:0 auto;
    padding:34px 18px 18px;
  }
  .eyebrow{
    color:var(--brass);
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
  }
  h1{
    margin:12px 0 8px;
    max-width:780px;
    font-family:Georgia,"Times New Roman","Noto Serif TC",serif;
    font-size:clamp(31px,5vw,56px);
    line-height:1.08;
    font-weight:500;
    letter-spacing:0;
  }
  .lede{
    margin:0;
    max-width:760px;
    color:var(--ink-soft);
    font-size:17px;
    line-height:1.65;
  }
  .hero-actions{
    display:none;
    margin-top:18px;
    gap:10px;
    flex-wrap:wrap;
  }
  .reader{
    max-width:1120px;
    margin:0 auto;
    padding:18px;
  }
  .reader-toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:12px 0;
    color:var(--ink-soft);
    font-size:14px;
  }
  .pages{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }
  .page{
    width:100%;
    max-width:920px;
    height:auto;
    display:block;
    background:white;
    border:1px solid var(--line);
    box-shadow:0 12px 36px rgba(22,32,46,.14);
  }
  .fallback{
    max-width:920px;
    margin:18px auto 42px;
    padding:18px;
    border:1px solid var(--line);
    background:var(--paper-deep);
    color:var(--ink-soft);
    font-size:14px;
    line-height:1.55;
  }
  @media(max-width:720px){
    .topbar-inner{
      min-height:58px;
      padding:10px 12px;
    }
    .brand span{max-width:36vw}
    .actions{gap:8px}
    .btn{
      min-height:34px;
      padding:0 10px;
      font-size:13px;
    }
    .topbar .actions{display:none}
    .hero-actions{display:flex}
    .hero{padding:24px 14px 10px}
    .reader{padding:10px 0 24px}
    .reader-toolbar{
      padding:8px 14px;
      font-size:13px;
    }
    .reader-toolbar span:last-child{display:none}
    .pages{gap:10px}
    .page{
      border-left:0;
      border-right:0;
      box-shadow:0 7px 20px rgba(22,32,46,.12);
    }
    .fallback{
      margin:14px 0 32px;
      border-left:0;
      border-right:0;
    }
  }
</style>
</head>
