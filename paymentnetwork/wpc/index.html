<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asia Payment Network 中文白皮书</title>
<style>
  :root{
    --ink:#16202e;
    --ink-soft:#445267;
    --paper:#f3efe6;
    --paper-deep:#e9e3d5;
    --brass:#a17c3c;
    --line:#cfc7b4;
    --white:#fbfaf6;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:24px;
    background:var(--paper);
    color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  main{
    width:min(720px,100%);
    border:1px solid var(--line);
    background:var(--paper-deep);
    padding:34px;
  }
  .eyebrow{
    color:var(--brass);
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
  }
  h1{
    margin:14px 0 12px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(30px,7vw,48px);
    line-height:1.08;
    font-weight:500;
    letter-spacing:0;
  }
  p{
    margin:0;
    color:var(--ink-soft);
    font-size:17px;
    line-height:1.65;
  }
  .actions{
    margin-top:26px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  a{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:40px;
    padding:0 14px;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--white);
    color:var(--ink);
    text-decoration:none;
    font-size:14px;
    font-weight:650;
  }
  a.primary{
    border-color:var(--brass);
    background:var(--brass);
    color:#1d1608;
  }
  @media(max-width:560px){
    body{padding:14px}
    main{padding:24px 20px}
    .actions{display:grid}
    a{width:100%}
  }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Whitepaper · Chinese</div>
  <h1>中文白皮书</h1>
  <p>中文版本会放在这个路径。英文白皮书已经可以阅读和下载。</p>
  <div class="actions">
    <a class="primary" href="../wpe/">Read English Whitepaper</a>
    <a href="../">Back to Asia Payment Network</a>
  </div>
</main>
</body>
</html>
