<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=900">
<meta name="description" content="Anson 四岁生日水上派对邀请函">
<title>Anson 四岁生日水上派对</title>
<style>
@font-face{
  font-family:'Baloo 2';font-style:normal;font-weight:500 800;font-display:swap;
  src:url('./baloo2-latin.woff2') format('woff2')
}
:root{
  --pool:#19AECE; --deep:#0B79A8; --sun:#FFC93C; --mango:#F59E2B;
  --maya:#E2593B; --coral:#FF6F61; --hib:#F2497C; --cream:#FFFBEF; --ink:#0A5E82;
}
*{margin:0;padding:0;box-sizing:border-box}
.zhf{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-weight:700}
html{min-height:100%;background:#EAF8FC}
body{width:900px;height:1280px;margin:0 auto;overflow:hidden;position:relative;
  background:linear-gradient(180deg,#FFE9B8 0%, #BFEAF5 26%, #8FD8EC 52%, #35B9DA 80%, #19AECE 100%);
  font-family:'Baloo 2','PingFang SC','Microsoft YaHei',sans-serif;color:var(--ink)}

/* bunting flags */
.bunting{position:absolute;top:0;left:0;width:900px;height:120px;z-index:5}

/* sun */
.sun{position:absolute;top:-80px;left:-80px;width:250px;height:250px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%, #FFE28A, var(--sun));
  box-shadow:0 0 0 24px rgba(255,201,60,.30), 0 0 0 50px rgba(255,201,60,.15)}
.cloud{position:absolute;background:#fff;border-radius:60px;opacity:.92}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.c1{width:140px;height:42px;top:150px;right:200px}
.c1::before{width:56px;height:56px;top:-26px;left:22px}
.c1::after{width:40px;height:40px;top:-16px;left:72px}
.palm{position:absolute;top:-16px;right:-30px;width:250px;height:220px;z-index:4}
.palmL{position:absolute;top:120px;left:-60px;width:200px;height:180px;transform:scaleX(-1);z-index:4;opacity:.9}
.hibiscus{position:absolute;z-index:6}
.hibiscus-right{top:236px;right:24px}
.hibiscus-left{top:100px;left:250px}

/* headline */
.eyebrow{position:absolute;top:128px;width:100%;text-align:center;z-index:6;
  font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-weight:900;font-size:26px;letter-spacing:6px;color:#0A6E97;text-transform:uppercase}
.name{position:absolute;top:162px;width:100%;text-align:center;z-index:6;
  font-weight:800;font-size:126px;line-height:1;color:#fff;
  text-shadow:0 5px 0 #0E86B4, 0 11px 0 rgba(10,94,130,.35);letter-spacing:2px}
.sub{position:absolute;top:281px;width:100%;text-align:center;z-index:6;
  font-weight:800;font-size:46px;color:var(--maya);text-shadow:0 3px 0 #fff;line-height:1.15;letter-spacing:4px}
.aloha{position:absolute;top:344px;width:100%;text-align:center;z-index:8;line-height:1;
  font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-weight:700;font-size:22px;color:#0A8FB8;letter-spacing:2px}

/* swim ring with 4 */
.ring4{position:absolute;top:120px;left:86px;width:142px;height:142px;border-radius:50%;z-index:7;
  background:repeating-conic-gradient(var(--maya) 0 45deg, #fff 45deg 90deg);
  box-shadow:inset 0 0 0 6px rgba(0,0,0,.05), 0 12px 22px rgba(9,79,110,.28);
  display:flex;align-items:center;justify-content:center;transform:rotate(-12deg)}
.ring4::before{content:'';position:absolute;width:74px;height:74px;border-radius:50%;
  background:linear-gradient(180deg,#8FD8EC,#35B9DA);box-shadow:inset 0 4px 8px rgba(9,79,110,.35)}
.ring4 b{position:relative;font-family:'Baloo 2';font-weight:800;font-size:60px;color:#fff;text-shadow:0 4px 0 #0E86B4}

/* pineapple left of card */
.pine{position:absolute;z-index:7}
.pine-left{bottom:196px;left:26px}

/* wavy card */
.card{position:absolute;left:66px;right:66px;top:404px;height:668px;z-index:6;
  background:var(--cream);border-radius:44px;
  box-shadow:0 18px 40px rgba(8,84,117,.30), inset 0 0 0 5px #fff}
.card::before{content:'';position:absolute;left:0;right:0;top:-16px;height:36px;
  background:radial-gradient(circle 18px at 18px 36px, var(--cream) 17px, transparent 18px);
  background-size:36px 36px;background-position:14px 0;background-repeat:repeat-x}
.card::after{content:'';position:absolute;left:0;right:0;bottom:-16px;height:36px;
  background:radial-gradient(circle 18px at 18px 0px, var(--cream) 17px, transparent 18px);
  background-size:36px 36px;background-position:14px 0;background-repeat:repeat-x}
.inner{position:absolute;inset:0;padding:48px 54px 34px;text-align:center}

.rowline{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:11px}
.rowline .lab{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-weight:900;font-size:24px;color:#fff;background:var(--coral);
  padding:3px 18px;border-radius:20px;letter-spacing:1px;box-shadow:0 3px 0 #D14A3E}
.rowline .val{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-weight:900;font-size:30px;color:var(--ink)}
.place-en{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-weight:700;font-size:21px;color:#2E96BC;margin-top:2px}
.addr{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-weight:500;font-size:17px;color:#3FA3C4;margin-top:3px}
.divider{margin:13px auto 10px;width:76%;height:14px}

.remind-title{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-weight:900;font-size:27px;color:var(--maya);letter-spacing:4px;margin-bottom:14px}
.tips{display:flex;justify-content:center;gap:20px}
.tip{width:198px;background:#EAF8FC;border:3px dashed #8ED4E8;border-radius:26px;padding:14px 10px 12px}
.tip .ico{height:70px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.tip .t1{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-weight:700;font-size:22px;color:var(--ink);line-height:1.3}

.funline{margin-top:14px;font-weight:800;font-size:26px;color:#0A6E97;line-height:1.45}
.funline b{color:var(--maya)}
.famline{margin-top:6px;font-weight:700;font-size:21px;color:#12839F;line-height:1.45}

/* bottom scene */
.scene{position:absolute;left:0;right:0;bottom:0;height:230px;z-index:3}
.hosted{position:absolute;bottom:20px;width:100%;text-align:center;z-index:9;
  font-weight:800;font-size:22px;color:#fff;text-shadow:0 2px 6px rgba(7,70,98,.5)}
</style>
</head>
