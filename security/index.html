<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Security</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f5ef;
      --text: #171717;
      --muted: #6b655c;
      --line: rgba(23, 23, 23, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 56px;
    }

    header {
      padding: 12px 0 24px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 52px);
      line-height: 1.05;
      font-weight: 650;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 760px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.6;
    }

    .video-frame {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .video-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    @media (max-width: 640px) {
      main {
        width: min(100% - 24px, 1120px);
        padding-top: 24px;
      }

      header {
        margin-bottom: 20px;
      }

      .subtitle {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Security</h1>
      <p class="subtitle">Cloudflare Stream video page.</p>
    </header>

    <section class="video-frame" aria-label="Security video">
      <iframe
        src="https://customer-xkg2sulcff1p098h.cloudflarestream.com/5cb461c32a122a40815802835aaad9f4/iframe?poster=https%3A%2F%2Fcustomer-xkg2sulcff1p098h.cloudflarestream.com%2F5cb461c32a122a40815802835aaad9f4%2Fthumbnails%2Fthumbnail.jpg%3Ftime%3D%26height%3D600"
        loading="lazy"
        allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;"
        allowfullscreen>
      </iframe>
    </section>
  </main>
</body>
</html>
