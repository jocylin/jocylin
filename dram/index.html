<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>半导体投资框架</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #111923;
      --text: #f4f7fb;
      --muted: #9aa7b6;
      --line: rgba(255, 255, 255, 0.1);
      --accent: #62d2a2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(98, 210, 162, 0.12), transparent 34%),
        linear-gradient(225deg, rgba(82, 139, 255, 0.12), transparent 38%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
    }

    main {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 56px 20px 72px;
    }

    header {
      margin-bottom: 28px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 820px;
      font-size: clamp(34px, 6vw, 64px);
      line-height: 1.04;
      letter-spacing: 0;
    }

    .meta {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .video-shell {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #000;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.36);
    }

    .video-frame {
      position: relative;
      width: 100%;
      padding-top: 64.69907407407408%;
    }

    .video-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 640px) {
      main {
        padding-top: 36px;
      }

      .meta {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">IOSG Research</p>
      <h1>半导体投资框架</h1>
      <p class="meta">2026-06-25 分享录像</p>
    </header>

    <section class="video-shell" aria-label="半导体投资框架视频">
      <div class="video-frame">
        <iframe
          src="https://customer-xkg2sulcff1p098h.cloudflarestream.com/22f51e930df1f43049867e8511f0d915/iframe?poster=https%3A%2F%2Fcustomer-xkg2sulcff1p098h.cloudflarestream.com%2F22f51e930df1f43049867e8511f0d915%2Fthumbnails%2Fthumbnail.jpg%3Ftime%3D%26height%3D600"
          loading="lazy"
          allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;"
          allowfullscreen="true">
        </iframe>
      </div>
    </section>

    <footer>
      Hosted on Cloudflare Stream and deployed through Cloudflare Pages.
    </footer>
  </main>
</body>
</html>
